name: Build Android APK

on:
  push:
    branches:
      - claude/pokemon-fish-mobile-game-cc8pq1
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk fischmon.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fischmon-apk
          path: fischmon.apk
          if-no-files-found: error

      - name: Publish rolling release
        if: github.ref_name == 'claude/pokemon-fish-mobile-game-cc8pq1' || github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Fischmon Android (neuester Build)
          prerelease: true
          files: fischmon.apk
          body: |
            Automatisch gebautes Debug-APK von **Fischmon**.

            **Installation:**
            1. `fischmon.apk` auf dem Android-Handy herunterladen.
            2. Beim Öffnen "Installation aus unbekannten Quellen" erlauben.
            3. App "Fischmon" starten und spielen.
